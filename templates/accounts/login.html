{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label for="{{ form.username.id_for_label }}">Username</label>
    {{ form.username }}
    <label for="{{ form.password.id_for_label }}">Password</label>
    {{ form.password }}
    <button type="submit">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
</div>
{% endblock %}
